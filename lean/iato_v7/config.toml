[orchestrator]
project = "IATO-V7"
release = "0.7.0"


[lean]
toolchain_file = "lean-toolchain"
lakefile = "lakefile.lean"
install_script = "scripts/install_lake.sh"
build_script = "scripts/build_lake.sh"
canonical_build = "./scripts/build_lake.sh"

[nmap]
binary = "nmap"
target = "127.0.0.1"
script = "lean/iato_v7/nse/path_audit.nse"
xml_output = "lean/iato_v7/nmap-path-state.xml"
flags = ["-Pn", "-sn"]
performance = ["--max-retries 1", "--host-timeout 30s"]

[nmap.timing]
default_env = "linux"

[nmap.timing.templates]
linux = "T3"
wsl2 = "T2"
kubernetes = "T4"

[nse]
root_path = "/workspace"
enforce_strict = true

[[nse.rules]]
path = "lakefile.toml"
permissions = "rw-r--r--"

[[nse.rules]]
path = "lean/iato_v7/scripts/env.sh"
permissions = "rwxr-xr-x"

[[nse.rules]]
path = "lean/iato_v7/scripts/install_lake.sh"
permissions = "rwxr-xr-x"

[[nse.rules]]
path = "lean/iato_v7/scripts/build_lake.sh"
permissions = "rwxr-xr-x"

[schema]
expected_version = "1.0.0"
